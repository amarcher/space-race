<!doctype html>
<!-- App Store screenshot compositor for Space Race.

     Renders ONE marketing screenshot per invocation, selected by query params,
     at the exact pixel size App Store Connect expects. Headless Chrome does the
     rasterizing — see render.sh next to this file.

       file://…/compose.html?slide=<id>&size=<iphone|ipad>

     Slides (captures live in ../screenshots/) are defined in SLIDES below.
     Brand ingredients come straight from the app: Unbounded/Inter woff2 from
     web/public/fonts, the #07071a space blue, the gold distance-value accent,
     and a CSS starfield standing in for the app's animated one. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Unbounded'; src: url('../../../web/public/fonts/unbounded-900.woff2') format('woff2'); font-weight: 900; }
  @font-face { font-family: 'Unbounded'; src: url('../../../web/public/fonts/unbounded-700.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Inter'; src: url('../../../web/public/fonts/inter-600.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url('../../../web/public/fonts/inter-500.woff2') format('woff2'); font-weight: 500; }

  html, body { margin: 0; padding: 0; }
  body {
    width: var(--page-w); height: var(--page-h);
    overflow: hidden; position: relative;
    /* ANGELIC GOLD — the brand warmth of the hero safety art (Ace Pilot's halo),
       per the owner's call, over the app's deep-space base. */
    background:
      radial-gradient(140% 90% at 80% -10%, rgba(212, 160, 60, 0.30), transparent 55%),
      radial-gradient(120% 80% at 10% 110%, rgba(255, 196, 90, 0.16), transparent 55%),
      #0a0814;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    color: #fff;
  }

  /* --- starfield: three parallax-ish layers of box-shadow stars --- */
  .stars, .stars::before, .stars::after { position: absolute; inset: 0; content: ''; }
  .star { position: absolute; border-radius: 50%; background: #fff; }

  /* --- caption block --- */
  .caption { text-align: center; z-index: 2; padding: 0 90px; }
  .caption h1 {
    font-family: 'Unbounded'; font-weight: 900;
    font-size: var(--h1-size); line-height: 1.12; margin: 0;
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, #ffffff 55%, #ffe3ad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-wrap: balance;
  }
  .caption h1 em {
    font-style: normal;
    background: linear-gradient(180deg, #ffe9a8, #ffd76a 60%, #e0a93e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .caption p {
    font-weight: 500; font-size: var(--sub-size); line-height: 1.35;
    color: rgba(255, 236, 205, 0.85); margin: 26px 0 0;
  }

  /* --- device frame: iPhone-style — uniform black bezel inside a thin
         titanium band with a bright outer edge, plus side buttons --- */
  .device-wrap { position: relative; z-index: 2; flex: 0 0 auto; }
  .device {
    position: relative;
    border-radius: var(--dev-radius);
    padding: var(--bezel);
    background: #050508; /* the uniform black screen surround */
    box-shadow:
      0 0 0 3px #101116,                    /* band inner shadow line */
      0 0 0 8px #62666f,                    /* titanium band */
      0 0 0 9.5px rgba(255, 255, 255, 0.4), /* polished outer edge */
      0 60px 140px rgba(0, 0, 0, 0.75),
      0 0 160px rgba(255, 190, 84, 0.22);
  }
  .device__btn {
    position: absolute;
    width: 7px;
    border-radius: 3.5px;
    background: linear-gradient(90deg, #868b96, #4a4e58);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  .device__btn--action { left: -16px; top: 15%; height: 42px; }
  .device__btn--vol1 { left: -16px; top: 21%; height: 78px; }
  .device__btn--vol2 { left: -16px; top: 28.5%; height: 78px; }
  .device__btn--power { right: -16px; top: 23%; height: 120px; }
  .ipad .device__btn { display: none; }
  .device img {
    display: block;
    width: var(--shot-w);
    border-radius: calc(var(--dev-radius) - var(--bezel));
  }
  /* dynamic-island hint (iphone only) */
  .device .island {
    position: absolute; top: calc(var(--bezel) + 18px); left: 50%;
    transform: translateX(-50%);
    width: 190px; height: 56px; border-radius: 999px;
    background: #050510;
  }
  .ipad .island, .duoOuter .island, .duoInner .island { display: none; }
  .ipad .device__btn, .duoInner .device__btn { display: none; }
  /* the Duo's outer display: camera + status strip down the right edge, drawn
     over the capture's safe-area column (the app lays out left of it) */
  .strip { display: none; }
  .duoOuter .strip {
    display: block; position: absolute; top: var(--bezel); bottom: var(--bezel);
    right: var(--bezel); width: var(--strip-w);
    border-radius: 0 calc(var(--dev-radius) - var(--bezel)) calc(var(--dev-radius) - var(--bezel)) 0;
    color: #f5ecd9; font-family: 'Inter'; font-weight: 600;
  }
  .duoOuter .strip__cam { position: absolute; top: 9%; left: 50%; transform: translateX(-50%); width: 54%; aspect-ratio: 1; border-radius: 50%; background: #050508; box-shadow: inset 0 0 0 2px #1a1a22; }
  .duoOuter .strip__time { position: absolute; top: 23%; left: 0; right: 0; text-align: center; font-size: calc(var(--strip-w) * 0.3); letter-spacing: -0.02em; }
  .duoOuter .strip__wifi { position: absolute; top: 31%; left: 50%; transform: translateX(-50%); width: 62%; }

  /* soft glow pedestal under the device */
  .device-wrap::after {
    content: ''; position: absolute; left: 50%; bottom: -40px;
    transform: translateX(-50%);
    width: 80%; height: 90px; border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255, 190, 90, 0.38), transparent 70%);
    filter: blur(18px);
  }

  /* --- badge row (sits under the sub-caption, above the device) --- */
  .badges { display: flex; gap: 26px; align-items: center; justify-content: center; margin-top: 44px; }
  .badge {
    font-weight: 600; font-size: var(--badge-size);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255, 232, 190, 0.85);
    border: 2px solid rgba(255, 205, 110, 0.4);
    border-radius: 999px; padding: 16px 34px;
    background: rgba(48, 36, 14, 0.5);
  }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search)
  const SIZE = params.get('size') || 'iphone'
  const SLIDE = params.get('slide') || 'takeover'

  // page + layout geometry per ASC size class
  const GEOM = {
    iphone: { w: 1284, h: 2778, shotW: 940, h1: 104, sub: 46, badge: 30, radius: 74, bezel: 22, capTop: 150, gap: 96 },
    ipad:   { w: 2064, h: 2752, shotW: 1360, h1: 118, sub: 50, badge: 32, radius: 64, bezel: 26, capTop: 130, gap: 86 },
    // iPhone Duo (one ASC set, APP_IPHONE_DUO, takes both displays): the outer
    // display is a short wide phone whose camera and status strip run down the
    // right edge (drawn below over the capture's inset column); the inner is
    // iPad-shaped. Captures come from ../screenshots/capture.mjs.
    duoOuter: { w: 1398, h: 2034, shotW: 900, h1: 92, sub: 42, badge: 28, radius: 64, bezel: 20, capTop: 110, gap: 64, strip: 79 * 3 * (900 / 1398) },
    duoInner: { w: 2007, h: 2853, shotW: 1300, h1: 118, sub: 50, badge: 32, radius: 64, bezel: 26, capTop: 130, gap: 86 },
  }[SIZE]

  const SLIDES = {
    // MARQUEE — slide 1. The App Store link unfurl thumbnails the FIRST
    // screenshot, so this one carries the full app title as the brand card.
    marquee: {
      shot: { iphone: '../screenshots/iphone-6.9-06-ace-hero.png', duoOuter: '../screenshots/duo-outer-06-ace-hero.png', duoInner: '../screenshots/duo-inner-06-ace-hero.png' },
      h1: 'Space Race:<br><em>1000 Light&#8209;Years</em>',
      sub: 'A cosmic card duel across the galaxy',
      marquee: true,
    },
    slingshot: {
      shot: { iphone: '../screenshots/iphone-6.9-03-slingshot.png' },
      h1: 'Pull off the <em>Slingshot!</em>',
      sub: 'Dodge at the last second — and surge ahead',
    },
    race: {
      shot: { iphone: '../screenshots/iphone-6.9-07-space-race.png', ipad: '../screenshots/ipad-13-03-space-race.png', duoOuter: '../screenshots/duo-outer-07-space-race.png', duoInner: '../screenshots/duo-inner-03-space-race.png' },
      h1: 'Race to <em>1,000</em> light-years',
      sub: 'Across deep space, with the real printed cards',
    },
    drag: {
      shot: { iphone: '../screenshots/iphone-6.9-08-drag.png' },
      h1: 'Drag, flick, <em>fly</em>',
      sub: 'Cards you can almost feel in your hand',
      badges: ['Free', 'Offline', 'No ads'],
    },
    drawtwo: {
      shot: { iphone: '../screenshots/iphone-6.9-09-draw-two.png' },
      h1: 'New: <em>Draw Two, Play Two</em>',
      sub: 'Two cards, two moves, every turn',
    },
    blocked: {
      shot: { iphone: '../screenshots/iphone-6.9-10-blocked.png', duoOuter: '../screenshots/duo-outer-10-blocked.png' },
      h1: 'Stuck in a <em>Black Hole?</em>',
      sub: 'Your way out lights up in your hand',
    },
    rules: {
      shot: { iphone: '../screenshots/iphone-6.9-02-rules.png', ipad: '../screenshots/ipad-13-02-rules.png' },
      h1: 'Every card, <em>explained</em>',
      sub: 'Full rules and card gallery built in',
      badges: ['No account', 'No signal needed'],
    },
  }

  const slide = SLIDES[SLIDE]
  const shot = slide.shot[SIZE] || slide.shot.iphone

  const root = document.documentElement
  root.style.setProperty('--page-w', GEOM.w + 'px')
  root.style.setProperty('--page-h', GEOM.h + 'px')
  root.style.setProperty('--shot-w', GEOM.shotW + 'px')
  root.style.setProperty('--h1-size', GEOM.h1 + 'px')
  root.style.setProperty('--sub-size', GEOM.sub + 'px')
  root.style.setProperty('--badge-size', GEOM.badge + 'px')
  root.style.setProperty('--dev-radius', GEOM.radius + 'px')
  root.style.setProperty('--bezel', GEOM.bezel + 'px')
  root.style.setProperty('--strip-w', (GEOM.strip || 0) + 'px')

  // deterministic pseudo-random starfield (seeded so renders are reproducible)
  let seed = 42
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  const stars = document.createElement('div')
  stars.className = 'stars'
  for (let i = 0; i < 220; i++) {
    const s = document.createElement('span')
    s.className = 'star'
    const r = rand() * 2.6 + 0.6
    s.style.width = s.style.height = r.toFixed(1) + 'px'
    s.style.left = (rand() * 100).toFixed(2) + '%'
    s.style.top = (rand() * 100).toFixed(2) + '%'
    s.style.opacity = (rand() * 0.65 + 0.2).toFixed(2)
    stars.appendChild(s)
  }
  document.body.appendChild(stars)

  // marquee (slide 1 / the unfurl thumbnail): bigger title, tighter gap so the
  // brand line dominates the small preview crop
  const h1Size = slide.marquee ? Math.round(GEOM.h1 * 1.22) : GEOM.h1
  const gap = slide.marquee ? Math.round(GEOM.gap * 0.7) : GEOM.gap
  if (slide.marquee) root.style.setProperty('--h1-size', h1Size + 'px')

  document.body.insertAdjacentHTML('beforeend', `
    <div class="caption" style="margin-top:${slide.marquee ? Math.round(GEOM.capTop * 0.85) : GEOM.capTop}px">
      <h1>${slide.h1}</h1>
      <p>${slide.sub}</p>
      ${slide.badges ? `<div class="badges">${slide.badges.map((b) => `<span class="badge">${b}</span>`).join('')}</div>` : ''}
    </div>
    <div class="device-wrap" style="margin-top:${gap}px">
      <div class="device ${SIZE}">
        <img src="${shot}" />
        <span class="island"></span>
        <span class="strip"><span class="strip__cam"></span><span class="strip__time">9:41</span>
          <svg class="strip__wifi" viewBox="0 0 48 40" fill="none" stroke="#f5ecd9" stroke-width="4" stroke-linecap="round"><path d="M4 14a30 30 0 0 1 40 0"/><path d="M11 22a20 20 0 0 1 26 0"/><path d="M18 30a10 10 0 0 1 12 0"/></svg></span>
        <span class="device__btn device__btn--action"></span>
        <span class="device__btn device__btn--vol1"></span>
        <span class="device__btn device__btn--vol2"></span>
        <span class="device__btn device__btn--power"></span>
      </div>
    </div>
  `)
</script>
</body>
</html>
