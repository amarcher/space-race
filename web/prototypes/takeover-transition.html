<title>Takeover Transitions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE, throwaway. Six treatments for the moment a played card becomes
     the full-screen clip, switchable from the bottom bar or by #cut #bloom
     #iris #dissolve #flip #porthole. Question it answers: how should the
     takeover enter so it grows from the card instead of cutting? Nothing here
     ships; the winner gets rewritten in CardTakeover.tsx / .css.
     Assets: assets/black-hole.mp4, assets/warp-200.mp4 (the standard 720x1280
     clips), the printed card faces and the card back, published next to this
     page (they live in web/public/cards/). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@500;700&display=swap">
<style>
  /* Layout: one fixed stage (the table), the takeover layers above it, a floating
     switcher pinned to the bottom. Single dark world, the game's own. */
  :root {
    --space: #07071a;
    --ink: #f5ecd9;
    --ink-dim: #b9ab92;
    --gold: #ffd76a;
    --line: rgba(255, 214, 120, 0.22);
    --red: rgba(255, 40, 60, 0.3);
    --font-display: 'Unbounded', 'Arial Black', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --card-w: clamp(78px, 24vw, 120px);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--space); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-text-size-adjust: 100%; }
  button { font: inherit; }

  /* ── the table ─────────────────────────────────────────────────────── */
  .stage { position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(60% 40% at 70% 20%, rgba(120, 60, 160, 0.28), transparent 70%),
      radial-gradient(50% 45% at 25% 55%, rgba(40, 120, 110, 0.22), transparent 70%),
      radial-gradient(70% 50% at 75% 75%, rgba(170, 110, 50, 0.22), transparent 70%),
      var(--space); }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
  .table { position: absolute; inset: 0;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(var(--card-w) * 1.4 * 0.9 + 70px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto auto; gap: 10px; }
  .mark { font: 700 17px/1 var(--font-display); text-shadow: 0 1px 10px rgba(0,0,0,.8); padding-top: 8px; }
  .note { font-size: 14px; line-height: 1.35; color: var(--ink-dim); max-width: 44ch; text-wrap: balance; min-height: 3.6em; }
  .row { display: flex; align-items: center; gap: 12px; }
  .slot { width: calc(var(--card-w) * 0.52); aspect-ratio: 5 / 7; border-radius: 6% / 4.3%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); position: relative; }
  .slot img, .you-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .slot img, .you-slot img { opacity: 0; transition: opacity 220ms ease; }
  .slot.filled img, .you-slot.filled img { opacity: 1; }
  .track { flex: 1; min-width: 0; height: 22px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); position: relative; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--fill); border-radius: 999px; background: linear-gradient(180deg, #8fd0ff, #5b8bff); box-shadow: 0 0 14px rgba(111,183,255,.5); }
  .track.foe i { background: linear-gradient(180deg, #a22, #701020); box-shadow: none; }
  .total { min-width: 5.2ch; text-align: right; font: 700 17px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .piles { display: flex; justify-content: center; align-items: center; gap: clamp(24px, 6vw, 56px); }
  .pile { width: calc(var(--card-w) * 0.82); aspect-ratio: 5 / 7; border-radius: 6% / 4.3%; position: relative; }
  .pile img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block;
    box-shadow: 1px 1px 0 #e9dcc0, 2px 2px 0 #d3c3a2, 3px 3px 0 #e9dcc0, 4px 4px 0 #cdbd9c, 8px 10px 18px rgba(0,0,0,.6); }
  .pile.discard { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
  .you-slot { width: var(--card-w); aspect-ratio: 5 / 7; border-radius: 6% / 4.3%; position: relative; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); }
  .you-slot img { opacity: 1; }
  .hint { position: absolute; left: 0; right: 0; text-align: center; font-size: 14px; color: var(--ink-dim); pointer-events: none;
    bottom: calc(var(--card-w) * 1.4 * 0.92 + 68px + env(safe-area-inset-bottom, 0px)); }

  /* the hand: two fanned cards you can tap */
  .hand { position: absolute; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); height: calc(var(--card-w) * 1.4); pointer-events: none; }
  .hcard { position: absolute; left: 50%; bottom: 0; width: var(--card-w); aspect-ratio: 5 / 7; margin-left: calc(var(--card-w) / -2);
    border-radius: 6% / 4.3%; border: 0; padding: 0; background: none; cursor: pointer; pointer-events: auto; touch-action: manipulation;
    transform: translate(var(--dx), 0) rotate(var(--rot)); transform-origin: 50% 90%;
    transition: transform 460ms cubic-bezier(0.3, 0.9, 0.3, 1), opacity 200ms ease; -webkit-tap-highlight-color: transparent; }
  .hcard img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.6); }
  .hcard:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .hcard.flying { transition: transform 460ms cubic-bezier(0.35, 0.8, 0.25, 1); z-index: 30; }
  .hcard.gone { opacity: 0; pointer-events: none; }
  .hcard.lifted { transition: transform 420ms ease, opacity 420ms ease; opacity: 0; }

  /* ── board dim under the takeover (the soft treatments use it) ──────── */
  .dim { position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0; background: rgba(2, 3, 16, 0.62);
    transition: opacity 420ms ease; }
  .dim.on { opacity: 1; }
  .dim.blur { backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); transition: opacity 520ms ease, backdrop-filter 520ms ease, -webkit-backdrop-filter 520ms ease; }
  .dim.blur.on { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* ── the takeover: one clip, six ways in ────────────────────────────── */
  .tk { position: fixed; inset: 0; z-index: 68; pointer-events: none; overflow: hidden; }
  .tk[hidden] { display: none !important; }
  .tk video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tk .tint { position: absolute; inset: 0; z-index: 1; }
  .tk.hazard .tint { background: radial-gradient(125% 100% at 50% 50%, transparent 42%, var(--red)); }
  .tk .vig { position: absolute; inset: 0; z-index: 2; background: radial-gradient(120% 92% at 50% 48%, transparent 52%, rgba(2,3,16,.9)); }
  .tk.leaving { transition: opacity 350ms ease; opacity: 0 !important; }

  /* 0 · cut (today): solid dark sheet, 300ms opacity in, the clip settles in */
  .tk.cut { background: #05050f; opacity: 0; transition: opacity 300ms ease; }
  .tk.cut.in { opacity: 1; }
  .tk.cut.hazard video { animation: settle 2600ms ease-out both; }
  .tk.cut.warp video { animation: dive 2600ms ease-out both; }
  @keyframes settle { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes dive { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }

  /* 1 · bloom: the clip is clipped to the landed card's rectangle, corners and
     all, and the rectangle grows to the screen; a gold halo breathes around it */
  .tk.bloom { clip-path: inset(var(--t) var(--r) var(--b) var(--l) round 14px); transition: clip-path 650ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .tk.bloom.in { clip-path: inset(0 0 0 0 round 0); }
  .halo { position: fixed; z-index: 67; pointer-events: none; border-radius: 14px; opacity: 0;
    left: var(--x); top: var(--y); width: var(--w); height: var(--h);
    box-shadow: 0 0 0 2px rgba(255,215,106,.9), 0 0 60px 30px rgba(255,205,95,.55); transition: left 650ms cubic-bezier(0.2,0.8,0.2,1), top 650ms cubic-bezier(0.2,0.8,0.2,1), width 650ms cubic-bezier(0.2,0.8,0.2,1), height 650ms cubic-bezier(0.2,0.8,0.2,1), opacity 300ms ease; }
  .halo.on { opacity: 1; left: -40px; top: -40px; width: calc(100% + 80px); height: calc(100% + 80px); }
  .halo.off { opacity: 0; }

  /* 2 · iris: a circle opens from the card's centre over the dimmed board */
  .tk.iris { clip-path: circle(0px at var(--cx) var(--cy)); transition: clip-path 760ms cubic-bezier(0.3, 0.7, 0.1, 1); }
  .tk.iris.in { clip-path: circle(150% at var(--cx) var(--cy)); }

  /* 3 · dissolve: no geometry at all; the board blurs and dims, the clip
     surfaces through it, settling from a little larger */
  .tk.dissolve { opacity: 0; transition: opacity 800ms ease; }
  .tk.dissolve.in { opacity: 1; }
  .tk.dissolve video { animation: surface 1400ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes surface { 0% { transform: scale(1.12); filter: blur(10px); } 100% { transform: scale(1); filter: blur(0); } }

  /* 4 · flip: the landed card turns over, its back is the clip, and the card
     grows to the screen while it turns (the clip is cropped to the card, so
     the picture zooms out as the frame opens) */
  .flip { position: fixed; z-index: 69; pointer-events: none; perspective: 1200px;
    left: var(--x); top: var(--y); width: var(--w); height: var(--h);
    transition: left 700ms cubic-bezier(0.3, 0.8, 0.2, 1), top 700ms cubic-bezier(0.3, 0.8, 0.2, 1), width 700ms cubic-bezier(0.3, 0.8, 0.2, 1), height 700ms cubic-bezier(0.3, 0.8, 0.2, 1); }
  .flip.open { left: 0; top: 0; width: 100%; height: 100%; }
  .flip .face { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: border-radius 700ms ease; }
  .flip.open .face { border-radius: 0; }
  .flip .face img, .flip .face video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .flip .back { transform: rotateY(180deg); background: #05050f; }
  .flip .card3d { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 700ms cubic-bezier(0.3, 0.8, 0.2, 1); }
  .flip.open .card3d { transform: rotateY(180deg); }
  .flip.leaving { transition: opacity 350ms ease; opacity: 0; }
  .flip[hidden] { display: none !important; }

  /* 5 · porthole: a soft-edged ellipse grows from the card; the edge stays
     feathered all the way, the board shows around it until it is covered */
  .tk.porthole {
    -webkit-mask-image: radial-gradient(ellipse closest-side, #000 62%, transparent 100%);
    mask-image: radial-gradient(ellipse closest-side, #000 62%, transparent 100%);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: var(--w) var(--h); mask-size: var(--w) var(--h);
    -webkit-mask-position: var(--x) var(--y); mask-position: var(--x) var(--y);
    transition: mask-size 900ms cubic-bezier(0.25, 0.7, 0.2, 1), mask-position 900ms cubic-bezier(0.25, 0.7, 0.2, 1), -webkit-mask-size 900ms cubic-bezier(0.25, 0.7, 0.2, 1), -webkit-mask-position 900ms cubic-bezier(0.25, 0.7, 0.2, 1); }
  .tk.porthole.in { -webkit-mask-size: 320vmax 320vmax; mask-size: 320vmax 320vmax; -webkit-mask-position: calc(var(--cx) - 160vmax) calc(var(--cy) - 160vmax); mask-position: calc(var(--cx) - 160vmax) calc(var(--cy) - 160vmax); }

  /* ── the switcher (not part of the design under review) ─────────────── */
  .bar { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px; background: #fff; color: #111; box-shadow: 0 6px 24px rgba(0,0,0,.5);
    max-width: calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))); }
  .bar button { min-width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #111; cursor: pointer; touch-action: manipulation; font-weight: 700; }
  .bar button:focus-visible { outline: 2px solid #111; }
  .bar .arrow { font-size: 22px; }
  .bar .name { padding: 0 8px; font-weight: 700; white-space: nowrap; font-size: 16px; }
  .bar .replay { background: #111; color: #fff; padding: 0 14px; }

  @media (prefers-reduced-motion: reduce) {
    .hcard, .hcard.flying, .tk, .halo, .flip, .flip .card3d, .flip .face, .dim { transition-duration: 1ms; animation-duration: 1ms; }
    .tk video { animation: none; }
  }
</style>

<div class="stage">
  <div class="stars" id="stars"></div>
  <div class="table">
    <div class="mark">Space Race</div>
    <div class="note" id="note"></div>
    <div class="row">
      <div class="slot" id="rivalSlot"><img src="assets/black-hole.webp" alt=""></div>
      <span class="total">575</span>
      <div class="track foe" style="--fill: 57.5%"><i></i></div>
    </div>
    <div class="piles">
      <div class="pile"><img src="assets/card-back.webp" alt="draw pile"></div>
      <div class="pile discard"></div>
    </div>
    <div class="row">
      <span class="total">525</span>
      <div class="track" id="yourTrack" style="--fill: 52.5%"><i></i></div>
    </div>
    <div class="row">
      <div class="you-slot" id="yourSlot"><img src="assets/ignition.webp" alt="Ignition"></div>
    </div>
  </div>
  <div class="hint" id="hint">Tap a card to play it</div>
  <div class="hand" id="hand">
    <button class="hcard" data-kind="black-hole" data-to="rival" style="--dx:-62%; --rot:-7deg" aria-label="Play Black Hole on the rival"><img src="assets/black-hole.webp" alt=""></button>
    <button class="hcard" data-kind="warp-200" data-to="track" style="--dx:62%; --rot:7deg" aria-label="Play Warp 200"><img src="assets/warp-200.webp" alt=""></button>
  </div>
</div>

<div class="dim" id="dim"></div>
<div class="halo" id="halo"></div>
<div class="tk" id="tk" hidden>
  <video id="clip" muted playsinline preload="auto"></video>
  <span class="tint"></span><span class="vig"></span>
</div>
<div class="flip" id="flip" hidden>
  <div class="card3d">
    <div class="face front"><img id="flipFace" src="assets/black-hole.webp" alt=""></div>
    <div class="face back"><video id="flipClip" muted playsinline preload="auto"></video></div>
  </div>
</div>

<div class="bar" role="group" aria-label="Treatment">
  <button class="arrow" id="prev" aria-label="Previous treatment">‹</button>
  <span class="name" id="name"></span>
  <button class="arrow" id="next" aria-label="Next treatment">›</button>
  <button class="replay" id="replay">Replay</button>
</div>

<script>
  // PROTOTYPE. Six ways from "card lands" to "clip fills the screen".
  const TREATMENTS = [
    { key: 'cut', name: 'Cut (today)', note: 'A solid dark sheet fades in over 300 ms, then the clip settles. The board vanishes under it at once.' },
    { key: 'bloom', name: 'Bloom', note: 'The clip is clipped to the landed card, corners and all, and that rectangle grows to the screen in 650 ms with a gold halo. The board dims under it.' },
    { key: 'iris', name: 'Iris', note: 'A circle opens from the card’s centre in 760 ms over a dimmed board. Hard edge, soft contrast.' },
    { key: 'dissolve', name: 'Dissolve', note: 'No shape at all. The board blurs and dims in 520 ms while the clip surfaces through it over 800 ms, settling from slightly larger.' },
    { key: 'flip', name: 'Flip', note: 'The landed card turns over and its back is the clip; the card grows to the screen as it turns, so the picture zooms out as the frame opens.' },
    { key: 'porthole', name: 'Porthole', note: 'A soft-edged ellipse grows from the card over 900 ms. The edge stays feathered the whole way and the dimmed board shows around it until it is covered.' },
  ]
  const HOLD_MS = 2500, FADE_MS = 350, FLY_MS = 460
  const $ = (id) => document.getElementById(id)
  const stars = $('stars'); let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 90; i++) { const s = document.createElement('i'); s.className = 'star'; s.style.left = (rand() * 100).toFixed(1) + '%'; s.style.top = (rand() * 100).toFixed(1) + '%'; s.style.opacity = (rand() * .6 + .2).toFixed(2); const r = (rand() * 1.6 + .6).toFixed(1); s.style.width = s.style.height = r + 'px'; stars.appendChild(s) }

  let idx = Math.max(0, TREATMENTS.findIndex((t) => t.key === location.hash.slice(1)))
  let busy = false, lastPlay = null
  const show = () => { const t = TREATMENTS[idx]; $('name').textContent = `${idx} · ${t.name}`; $('note').textContent = t.note; try { history.replaceState(null, '', '#' + t.key) } catch {} }
  const step = (d) => { idx = (idx + d + TREATMENTS.length) % TREATMENTS.length; show() }
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1)
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1) })
  show()

  const rectVars = (el, r) => { el.style.setProperty('--x', r.left + 'px'); el.style.setProperty('--y', r.top + 'px'); el.style.setProperty('--w', r.width + 'px'); el.style.setProperty('--h', r.height + 'px'); el.style.setProperty('--cx', (r.left + r.width / 2) + 'px'); el.style.setProperty('--cy', (r.top + r.height / 2) + 'px'); el.style.setProperty('--t', r.top + 'px'); el.style.setProperty('--l', r.left + 'px'); el.style.setProperty('--r', (innerWidth - r.right) + 'px'); el.style.setProperty('--b', (innerHeight - r.bottom) + 'px') }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))

  async function takeover(kind, rect, cardSrc) {
    const t = TREATMENTS[idx].key, tk = $('tk'), clip = $('clip'), dim = $('dim'), halo = $('halo'), flip = $('flip')
    const variant = kind === 'warp-200' ? 'warp' : 'hazard'
    const src = `assets/${kind}.mp4`
    if (t === 'flip') {
      const v = $('flipClip'); v.src = src; v.currentTime = 0; $('flipFace').src = cardSrc
      rectVars(flip, rect); flip.className = 'flip'; flip.hidden = false
      dim.className = 'dim on'
      v.play().catch(() => {})
      await wait(20); flip.classList.add('open')
      await wait(HOLD_MS + 500)
      flip.classList.add('leaving'); dim.className = 'dim'
      await wait(FADE_MS); flip.hidden = true; v.pause(); return
    }
    clip.src = src; clip.currentTime = 0
    rectVars(tk, rect); rectVars(halo, rect)
    tk.className = `tk ${t} ${variant}`; tk.hidden = false; void tk.offsetWidth
    if (t === 'bloom') { dim.className = 'dim on'; halo.className = 'halo'; void halo.offsetWidth; halo.classList.add('on') }
    if (t === 'iris' || t === 'porthole') dim.className = 'dim on'
    if (t === 'dissolve') dim.className = 'dim blur on'
    clip.play().catch(() => {})
    await wait(20); tk.classList.add('in')
    if (t === 'bloom') { await wait(650); halo.classList.add('off') }
    await wait(HOLD_MS)
    tk.classList.add('leaving'); dim.className = dim.classList.contains('blur') ? 'dim blur' : 'dim'
    await wait(FADE_MS); tk.hidden = true; tk.className = 'tk'; clip.pause(); halo.className = 'halo'
  }

  async function play(card) {
    if (busy) return; busy = true; lastPlay = card
    const kind = card.dataset.kind, to = card.dataset.to
    const target = to === 'rival' ? $('rivalSlot') : $('yourTrack')
    const from = card.getBoundingClientRect(), dest = target.getBoundingClientRect()
    // fly: translate the hand card onto its slot (a hazard lands on the rival's
    // status; a distance card dives into your track and shrinks away)
    const scale = to === 'rival' ? dest.width / from.width : 0.3
    const dx = (dest.left + dest.width / 2) - (from.left + from.width / 2), dy = (dest.top + dest.height / 2) - (from.top + from.height / 2)
    $('hint').textContent = ''
    card.classList.add('flying'); card.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`
    await wait(FLY_MS)
    let landed = dest
    if (to === 'rival') { target.classList.add('filled'); landed = target.getBoundingClientRect() }
    else { landed = card.getBoundingClientRect() }
    card.classList.add('gone')
    await takeover(kind, landed, card.querySelector('img').src)
    // back to the hand so you can tap again
    await wait(900)
    target.classList.remove('filled'); card.style.transform = ''; card.classList.remove('flying', 'gone')
    $('hint').textContent = 'Tap a card to play it'
    busy = false
  }
  document.querySelectorAll('.hcard').forEach((c) => c.addEventListener('click', () => play(c)))
  $('replay').onclick = () => { const c = lastPlay || document.querySelector('.hcard'); play(c) }
</script>
