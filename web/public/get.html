<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Space Race — Play Anywhere</title>
    <meta
      name="description"
      content="Play Space Race: 1000 Light-Years on the web, iOS, Android, Amazon Fire, or buy the physical card game."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://game.spaceexplorer.tech/get" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://game.spaceexplorer.tech/get" />
    <meta property="og:title" content="Space Race — Play Anywhere" />
    <meta
      property="og:description"
      content="Play on the web, iOS, Android, Amazon Fire, or buy the physical card game."
    />
    <meta property="og:site_name" content="Space Race" />

    <meta name="theme-color" content="#07071a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        max-width: 32rem;
        padding: 3.5rem 1.25rem 4rem;
        background: #07071a;
        color: #e8e8f2;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p.tagline {
        color: #9a9ab0;
        margin: 0 0 2rem;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        text-align: left;
      }
      .link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.1rem;
        border-radius: 12px;
        background: #12122b;
        border: 1px solid #22224a;
        color: #e8e8f2;
        text-decoration: none;
        font-weight: 600;
      }
      .link:active {
        background: #1a1a3d;
      }
      .link--soon {
        opacity: 0.55;
        cursor: default;
      }
      .link span.sub {
        display: block;
        font-weight: 400;
        color: #9a9ab0;
        font-size: 0.85rem;
        margin-top: 0.1rem;
      }
      .link .chevron {
        color: #6a6a90;
        flex-shrink: 0;
      }
      .link--shop {
        background: linear-gradient(135deg, #1a1a3d, #24244f);
        border-color: #ffd93d55;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="/icon-192.png" alt="" />
    <h1>Space Race</h1>
    <p class="tagline">A cosmic race to 1,000 light-years. Play free, anywhere.</p>

    <div class="links">
      <a class="link" href="https://game.spaceexplorer.tech">
        <span>Play free on the web<span class="sub">Works in any browser, installs as an app</span></span>
        <span class="chevron">→</span>
      </a>
      <a class="link" href="https://apps.apple.com/us/app/space-race-1000-light-years/id6788064058">
        <span>App Store<span class="sub">iPhone &amp; iPad</span></span>
        <span class="chevron">→</span>
      </a>
      <span class="link link--soon">
        <span>Google Play<span class="sub">Coming soon</span></span>
      </span>
      <span class="link link--soon">
        <span>Amazon Appstore<span class="sub">Coming soon — Fire tablets</span></span>
      </span>
      <a class="link link--shop" href="/shop">
        <span>Buy the physical game<span class="sub">First Edition card deck — pre-order now</span></span>
        <span class="chevron">→</span>
      </a>
    </div>
  </body>
</html>
