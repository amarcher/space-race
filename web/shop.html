<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>Space Race — The card game</title>
    <meta
      name="description"
      content="Race to 1,000 light-years. A tabletop card game for 2–4 players. Available now."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://game.spaceexplorer.tech/shop" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://game.spaceexplorer.tech/shop" />
    <meta
      property="og:title"
      content="Space Race — The card game"
    />
    <meta
      property="og:description"
      content="Race to 1,000 light-years. A tabletop card game for 2–4 players. Available now."
    />
    <meta
      property="og:image"
      content="https://game.spaceexplorer.tech/shop/hero.jpg"
    />
    <meta
      property="og:image:alt"
      content="The Space Race physical card game, with its illustrated cards, tuck box, and rulebook"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:site_name" content="Space Race" />

    <meta name="theme-color" content="#0d0a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link
      rel="preload"
      as="image"
      href="/shop/scroll/table-d.webp"
      media="(min-width: 861px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/shop/scroll/table-m.webp"
      media="(max-width: 860px)"
      fetchpriority="high"
    />

    <!-- Fonts are self-hosted (see src/shop/Shop.css) — no Google Fonts request. -->

    <!-- Google Analytics 4, the same property as the game (index.html) and /get.
         Ads link straight here, and without it a visit is invisible until it
         becomes an order. Skipped inside the native Android ships for the reason
         given in index.html: both are child-directed and must not load gtag.
         The order confirmation URL carries the Stripe session id, so that one
         page reports a location without its query string. -->
    <script>
      if (!/SpaceRaceAmazon|SpaceRaceAndroid/.test(navigator.userAgent)) {
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { window.dataLayer.push(arguments) }
        gtag('js', new Date())
        gtag('set', 'user_properties', { platform: 'web' })
        gtag(
          'config',
          'G-GS8HYJ69C3',
          /[?&]session_id=/.test(location.search)
            ? { page_location: location.origin + location.pathname + '?order=confirmed' }
            : {}
        )
        var ga = document.createElement('script')
        ga.async = true
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-GS8HYJ69C3'
        document.head.appendChild(ga)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shop/main.tsx"></script>
  </body>
</html>
