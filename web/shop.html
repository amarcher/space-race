    <meta

    />
    <link

    <!-- Fonts are self-hosted (see src/shop/Shop.css) — no Google Fonts request. -->

    <!-- Google Analytics 4, the same property as the game (index.html) and /get.
         Ads link straight here, and without it a visit is invisible until it
         becomes an order. Skipped inside the native Android ships for the reason
         given in index.html: both are child-directed and must not load gtag.
         The order confirmation URL carries the Stripe session id, so that one
         page reports a location without its query string. -->
    <script>
      if (!/SpaceRaceAmazon|SpaceRaceAndroid/.test(navigator.userAgent)) {
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { window.dataLayer.push(arguments) }
        gtag('js', new Date())
        gtag('set', 'user_properties', { platform: 'web' })
        gtag(
          'config',
          'G-GS8HYJ69C3',
          /[?&]session_id=/.test(location.search)
            ? { page_location: location.origin + location.pathname + '?order=confirmed' }
            : {}
        )
        var ga = document.createElement('script')
        ga.async = true
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-GS8HYJ69C3'
        document.head.appendChild(ga)
      }
    </script>

    <!-- Meta Pixel, so ads can be aimed at people who buy or go on to the app
         rather than people who merely click. It lives on the two marketing
         pages only (/shop and /get): never the game, and never inside the
         native Android ships. It is not loaded on the
         order confirmation page: every Pixel event carries the page URL, and
         that one holds the Stripe session id. -->
    <script>
      if (!/SpaceRaceAmazon|SpaceRaceAndroid/.test(navigator.userAgent) && !/[?&]session_id=/.test(location.search)) {
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments)
          }
          if (!f._fbq) f._fbq = n
          n.push = n
          n.loaded = !0
          n.version = '2.0'
          n.queue = []
          t = b.createElement(e)
          t.async = !0
          t.src = v
          s = b.getElementsByTagName(e)[0]
          s.parentNode.insertBefore(t, s)
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js')
        // Only the events this page names. Left on, the Pixel also reports
        // button text and page metadata on every tap.
        fbq('set', 'autoConfig', false, '1136433712146400')
        fbq('init', '1136433712146400')
        fbq('track', 'PageView')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shop/main.tsx"></script>
  </body>
</html>
